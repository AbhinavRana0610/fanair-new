    <circle cx="20" cy="20" r="2.5" fill="#E60012"/>
    <!-- YAMAHA Text -->
    <text x="47" y="27.5" font-family="'Plus Jakarta Sans', 'Arial Black', Arial, sans-serif" font-size="21" font-weight="900" fill="#E60012" letter-spacing="1">YAMAHA</text>
