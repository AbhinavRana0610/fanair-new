    <circle cx="20" cy="20" r="15" fill="#FFFFFF"/>
    <!-- 3 Tuning Forks in center -->
    <g stroke="#E60012" stroke-width="2.2" stroke-linecap="round" fill="none">
      <line x1="20" y1="20" x2="20" y2="7"/>
      <line x1="20" y1="20" x2="8.7" y2="26.5"/>
      <line x1="20" y1="20" x2="31.3" y2="26.5"/>
      <!-- Forks ends -->
